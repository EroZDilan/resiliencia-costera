<app-back-button text="Eventos" />

@if (item; as entity) {
  <div class="row">
    <div class="col-xs-12">
      @if (entity.imagen) {
        <div class="noticia_imagen">
          <img width="100%" [src]="adjuntos.url(entity.imagen)" />
        </div>
      }
      <p class="noticia_fecha show">De {{ entity.fechaInicio | dateToStr }} al {{ entity.fechaFin | dateToStr }}</p>
      <p class="noticia_titulo show">{{ entity.titulo }}</p>
      <p class="noticia_noticia show">{{ entity.descripcion }}</p>
    </div>
  </div>
}
