<app-back-button text="Escríbanos" />

<table width="100%">
  <tr>
    <td>
      <div class="title">Escríbanos</div>
    </td>
  </tr>
</table>

<div style="padding-left: 100px; padding-right: 200px">
  @if (codigoGenerado) {
    <div class="alert alert-success">
      <strong><i class="fas fa-info-circle bigger-150"></i> ¡Gracias! Su solicitud fue registrada con el código {{ codigoGenerado }}.</strong>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="form bg-light-grey">
      <div class="form-group row">
        <label class="col-sm-3">Asunto</label>
        <div class="col-sm-9">
          <select class="form-control" formControlName="tipo">
            <option value="" disabled>--- Seleccione ---</option>
            @for (t of tipos; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-3">Texto</label>
        <div class="col-sm-9">
          <textarea class="form-control" formControlName="descripcion" rows="5"></textarea>
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-3">Nombre</label>
        <div class="col-sm-9"><input class="form-control" formControlName="nombre" /></div>
      </div>
      <div class="form-group row">
        <label class="col-sm-3">Correo electrónico</label>
        <div class="col-sm-9"><input class="form-control" formControlName="email" /></div>
      </div>
      <div class="form-group row">
        <label class="col-sm-3">Teléfono</label>
        <div class="col-sm-9"><input class="form-control" formControlName="telefono" /></div>
      </div>
      <div class="form-group row">
        <label class="col-sm-3">Ocupación</label>
        <div class="col-sm-9"><input class="form-control" formControlName="ocupacion" /></div>
      </div>
      <div class="form-group row">
        <div class="col-sm-9 col-sm-offset-3">
          <button type="submit" class="btn btn-primary" [disabled]="sending">Enviar</button>
        </div>
      </div>
    </form>
  }
</div>
