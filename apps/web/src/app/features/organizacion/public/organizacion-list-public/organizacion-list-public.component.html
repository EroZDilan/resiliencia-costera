<app-back-button text="Organizaciones" />

<div class="title texto-centrado">Organizaciones</div>

<div class="row">
  @for (entity of items; track entity.id) {
    <div class="col-xs-12 col-sm-6">
      <div style="padding-left: 25px; padding-right: 25px">
        <div class="texto-centrado" style="width: 100%; height: 200px">
          @if (entity.logo) {
            <a class="action_edit" [routerLink]="['/organizaciones', entity.slug]">
              <img class="logo-organizacion" [src]="adjuntos.url(entity.logo)" style="height: 100%" />
            </a>
          }
        </div>
        <div class="contenido-vertical-centrado" style="height: 135px">
          <p class="titulo-organizacion texto-centrado">{{ entity.nombre }}</p>
        </div>
        <p class="line-clamp contenido-organizacion texto-centrado">{{ entity.descripcion }}</p>
        <table style="width: 100%">
          <tr>
            <td style="width: 33%; text-align: center"><img src="images/icon/svg/world.png" style="width: 30px" /></td>
            <td style="width: 33%; text-align: center"><img src="images/icon/svg/envelope.png" style="width: 30px" /></td>
            <td style="width: 33%; text-align: center"><img src="images/icon/svg/phone.png" style="width: 30px" /></td>
          </tr>
        </table>
        <hr />
        <table style="width: 100%">
          <tr>
            <td style="width: 33%; text-align: center"><img src="images/icon/svg/facebook.svg" style="width: 30px" /></td>
            <td style="width: 33%; text-align: center"><img src="images/icon/svg/twitter.svg" style="width: 30px" /></td>
            <td style="width: 33%; text-align: center"><img src="images/icon/svg/instagram.svg" style="width: 30px" /></td>
          </tr>
        </table>
      </div>
    </div>
  }
</div>
